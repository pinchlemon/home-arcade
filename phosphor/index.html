<style>
/* Layout: one handheld-style screen centred in the dark, key legend (desktop) or touch pad (phone) beneath */
:root{
  --bg:#08090b;
  --shell:#101114;
  --shell-edge:#2a2b2e;
  --ink:#e9e7dc;
  --dim:#7d7b74;
  --btn:#16171a;
  --btn-on:#2c2d31;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px;
  margin:0;padding-inline:16px;padding-block:12px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.shell{background:var(--shell);border:1px solid var(--shell-edge);border-radius:14px;padding:10px;box-shadow:0 0 0 1px #000,0 24px 70px rgba(0,0,0,.65);max-width:100%;box-sizing:border-box}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:none;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center;color:var(--dim);max-width:100%;letter-spacing:.04em}
.legend b{color:var(--ink);font-weight:600}
.pad{display:none;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;max-width:520px}
.pad button{background:var(--btn);border:1px solid var(--shell-edge);color:var(--ink);font:600 13px var(--mono);border-radius:8px;touch-action:none;padding:0}
.pad button.on{background:var(--btn-on)}
.shoulders{grid-column:1/-1;display:flex;justify-content:space-between}
.shoulders button{width:84px;height:34px}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
.mid{display:flex;flex-direction:column;gap:10px;align-items:center}
.mid button{width:72px;height:28px;font-size:11px}
.ab{display:grid;grid-template-columns:repeat(2,56px);gap:10px;align-items:center}
.ab button{height:56px;border-radius:50%}
.ab button[data-b="b"]{transform:translateY(16px)}
@media (pointer:coarse){.pad{display:grid}.legend{display:none}}
</style>

let CAU=null;
const hz=v=>110*v;
function startCatchAudio(sp){
  if(!AC)return;
  const t=AC.currentTime;
  const bus=AC.createGain();bus.gain.setValueAtTime(0.0001,t);bus.gain.exponentialRampToValueAtTime(1,t+0.4);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;bus.connect(lp);lp.connect(master);
  const rs=AC.createGain();rs.gain.value=0.25;lp.connect(rs);rs.connect(reverb);
  const fo=AC.createOscillator();fo.type=sp.wave;const fg=AC.createGain();fg.gain.value=sp.wave==='square'?0.028:0.06;fo.connect(fg);fg.connect(bus);
  const po=AC.createOscillator();po.type='sine';const pg=AC.createGain();pg.gain.value=0.06;po.connect(pg);pg.connect(bus);
  let lfo=null;
  if(sp.key==='listener'){lfo=AC.createOscillator();lfo.frequency.value=5.5;const lg=AC.createGain();lg.gain.value=5;lfo.connect(lg);lg.connect(fo.frequency);lfo.start();}
  fo.frequency.value=hz(C.f);po.frequency.value=hz(G.pf);

function updateCatchAudio(){
  if(!CAU)return;

function stopCatchAudio(){
  if(!CAU||!AC)return;

  setTimeout(()=>{try{c.fo.stop();c.po.stop();if(c.lfo)c.lfo.stop();c.bus.disconnect();}catch(e){}},700);

  for(let y=0;y<H;y++){const by=(y&3)<<2;for(let x=0;x<W;x++){

function drawBursts(dt){
  for(let i=BURSTS.length-1;i>=0;i--){const b=BURSTS[i];b.t+=dt;const life=b.big?1.5:0.95;if(b.t>life){BURSTS.splice(i,1);continue;}
    const X=isoX(b.x,b.y),Y=isoY(b.x,b.y),cyc=(T*26)|0;

      for(let j=0;j<n;j++){if(k>0.45&&(j+r)%2)continue;if(k>0.75&&(j+r)%3)continue;
        const a=j/n*TAU+r*0.4+k*0.6,wx=b.x+Math.cos(a)*rad,wy=b.y+Math.sin(a)*rad;if(tvG(wx>>3,wy>>3))continue;
        px(Math.round(isoX(wx,wy)),Math.round(isoY(wx,wy)),rainbow((j>>1)+cyc+r*2,k>0.6?'6':''));}}

function findSpot(R,used,o){

    const i=waterTiles[(R()*waterTiles.length)|0];const z=tileDist[i]/maxDist;if(z<(o.minZ||0)||z>(o.maxZ===undefined?1:o.maxZ))continue;

    let ok=true;for(const rr of[4,o.clear||10])if(!clearAt(x,y,rr)){ok=false;break;}if(!ok)continue;

function placeThings(li){

    b.ix=b.x+3;b.iy=b.y+14;for(let k=10;k<34;k++){if(!solid(b.x+3,b.y+k)){b.ix=b.x+3;b.iy=b.y+k+5;break;}}}

  for(let n=0;n<nv;n++){const s=findSpot(R,used,{clear:10,minHome:homeMin,minSep:90,minZ:0.25});if(!s)continue;used.push(s);VENTS.push({x:s.x,y:s.y,seed:R()*10,night:-1});}

      if(!ok)continue;p.pts=[-2,-1,0,1,2].map(k=>({x:s.x+Math.cos(p.a)*k*14,y:s.y+Math.sin(p.a)*k*14}));

}

let G,K,fishes=[],PR=null,SON=null,C=null,SH=null,LG=null,RV=null,ST=null,EN=null,IN=null;
const BL=[],RP=[];let MSG=null,BAN=null;

function resetKayak(){if(WORLDS[0]&&LAYER!==0)useLayer(0);K={x:SPAWN.x,y:SPAWN.y,vx:0,vy:0,ang:0,mode:'free',strokeT:0,side:1,stroke:0,paddling:false};}
function newGame(){
  G={ch:0,knob:3.4,state:'title',night:1,rubles:0,battery:100,batMax:100,cargo:[],cargoMax:4,
     up:{valve:false,squelch:false,cell:false,net:false,tape:false},
     log:Object.fromEntries(ORDER.map(k=>[k,{n:0,best:0}])),
     pf:3,visits:0,samples:0,tuned:[],totalCaught:0,catches:0,pinged:false,listenerCaught:false,sonarCool:0,dripT:1,alarmT:0,padT:1};

const FISH_N=6;
function clearAt(x,y,r){for(let a=0;a<8;a++)if(solid(x+Math.cos(a*TAU/8)*r,y+Math.sin(a*TAU/8)*r))return false;return !solid(x,y);}
function randWaterSpot(minD,maxD,avoidK){
  for(let t=0;t<300;t++){const i=waterTiles[(rnd()*waterTiles.length)|0];const dd=tileDist[i];if(dd<minD||dd>maxD)continue;
    const x=(i%MW)*TS+4,y=((i/MW)|0)*TS+4;if(!clearAt(x,y,7))continue;if(avoidK&&K&&Math.hypot(x-K.x,y-K.y)<140)continue;return{x,y,z:dd/maxDist};}
  return null;
}
function pickSpecies(z){const tb=LAYERS[LAYER].zones[z<0.5?0:1];let tot=0;for(const[,w]of tb)tot+=w;let r=rnd()*tot;for(const[k,w]of tb){if((r-=w)<=0)return k;}return tb[0][0];}
function spawnFish(f){
  if(DREAM)return spawnThought(f);
  const s=randWaterSpot(16,1e9,true)||randWaterSpot(8,1e9,false)||{x:300,y:300,z:0.5};
  Object.assign(f,{x:s.x,y:s.y,sp:pickSpecies(s.z),size:0.75+rnd()*0.5+s.z*0.12,state:'wander',tx:s.x,ty:s.y,pulse:0,glowT:rnd()*5,special:false,kOff:(rnd()-0.5)*0.5,seed:rnd()*100,wig:rnd()*6,ux:1,uy:0,vx:0,vy:0});
  return f;
}
const VENT_FISH=['eel','lamprey','wraith'];
function spawnVentFish(){for(const v of VENTS){if(rnd()>0.6)continue;const f=spawnFish({});f.home=v;f.x=v.x+(rnd()-0.5)*20;f.y=v.y+(rnd()-0.5)*20;if(solid(f.x,f.y)){f.x=v.x;f.y=v.y+12;}f.tx=f.x;f.ty=f.y;f.sp=VENT_FISH[LAYER];f.size+=0.3;fishes.push(f);}}
function spawnListener(){
  let s=null;if(ANOMALY)for(let t=0;t<40&&!s;t++){const a=rnd()*TAU,r=10+rnd()*40,x=ANOMALY.x+Math.cos(a)*r,y=ANOMALY.y+Math.sin(a)*r;if(clearAt(x,y,6))s={x,y};}
  s=s||randWaterSpot(Math.floor(maxDist*0.85),1e9,false)||randWaterSpot(Math.floor(maxDist*0.6),1e9,false);
  if(!s)return;
  fishes.push({x:s.x,y:s.y,sp:'listener',size:0.75+rnd()*0.5,state:'wander',tx:s.x,ty:s.y,pulse:0,glowT:1,special:true,kOff:(rnd()-0.5)*0.3,seed:rnd()*100,wig:0,ux:1,uy:0,vx:0,vy:0});
}
function fishGlow(f){
  if(f.state==='gone')return 0;
  if(f.state==='hooked')return 1;
  if(f.state==='approach')return 0.75;
  if(f.state==='flee')return 0.6;
  return f.pulse>0?Math.sin(f.pulse/1.6*Math.PI)*(f.sp==='listener'?0.9:0.6):0;
}
function fishFlee(f){if(!f||f.state==='gone')return;const a=Math.atan2(f.y-K.y,f.x-K.x)+(rnd()-0.5);f.state='flee';f.fleeT=1.2;f.vx=Math.cos(a)*45;f.vy=Math.sin(a)*45;}
function updateFish(f,dt){
  if(f.state==='gone'){if(f.special)return;f.respawn-=dt;if(f.respawn<=0){spawnFish(f);if(f.home){const v=f.home;f.x=v.x;f.y=v.y+10;if(solid(f.x,f.y)){f.x=v.x;f.y=v.y;}f.tx=f.x;f.ty=f.y;f.sp=VENT_FISH[LAYER];f.size+=0.3;}}return;}
  const ox=f.x,oy=f.y;
  updateFishMove(f,dt);
  const vx=(f.x-ox)/Math.max(dt,1e-4),vy=(f.y-oy)/Math.max(dt,1e-4),sdx=vx-vy,sdy=(vx+vy)/2,sm=Math.hypot(sdx,sdy);
  f.wig+=dt*(3+Math.min(sm,30)*0.25);
  if(sm>0.5){f.ux+=(sdx/sm-f.ux)*Math.min(1,dt*5);f.uy+=(sdy/sm-f.uy)*Math.min(1,dt*5);}
}
function updateFishMove(f,dt){
  f.glowT-=dt;if(f.glowT<=0){f.glowT=(f.sp==='listener'?2:3)+rnd()*5;f.pulse=1.6;}if(f.pulse>0)f.pulse-=dt;
  if(f.state==='wander'){
    const dx=f.tx-f.x,dy=f.ty-f.y,dd=Math.hypot(dx,dy);
    if(dd<2){for(let n=0;n<6;n++){const a=rnd()*TAU,r=10+rnd()*36;const nx=f.x+Math.cos(a)*r,ny=f.y+Math.sin(a)*r;if(clearAt(nx,ny,5)&&Math.hypot(nx-HOME.x,ny-HOME.y)>(LAYER===0?120:50)&&(!f.home||Math.hypot(nx-f.home.x,ny-f.home.y)<45)){f.tx=nx;f.ty=ny;break;}}}
    else{const s=Math.min(dd,7*dt);const nx=f.x+dx/dd*s,ny=f.y+dy/dd*s;if(solid(nx,ny)){f.tx=f.x;f.ty=f.y;}else{f.x=nx;f.y=ny;}}
  }else if(f.state==='hooked'){
    if(DREAM){dreamOrbit(f,dt);return;}
    const spd=SPECIES[f.sp].speed*(1-RIG.progress*0.3);
    if(f.hdir===undefined)f.hdir=Math.atan2(f.y-K.y,f.x-K.x);
    f.think=(f.think||0)-dt;
    if(f.think<=0){
      f.think=0.18;
      const ax=f.x-K.x,ay=f.y-K.y,am=Math.hypot(ax,ay)||1,veer=Math.sin(T*0.9+f.seed)*0.5;
      let best=f.hdir,bs=-1e9,mostFree=-1,mfA=f.hdir;
      for(let i=0;i<20;i++){
        const a=i/20*TAU,dx=Math.cos(a),dy=Math.sin(a);
        let free=0;for(let r=2;r<=48;r+=3){if(!clearAt(f.x+dx*r,f.y+dy*r,2))break;free=r;}
        if(free>mostFree){mostFree=free;mfA=a;}
        if(free<8)continue;
        const away=(dx*ax+dy*ay)/am,keep=Math.cos(a-f.hdir),side=Math.cos(a-(Math.atan2(ay,ax)+Math.PI/2*Math.sign(veer||1)));
        const sc=away*1.2+free/48*1.4+keep*0.7+side*Math.abs(veer)*0.6;
        if(sc>bs){bs=sc;best=a;}
      }
      f.goal=bs>-1e9?best:mfA;
    }
    if(!isFinite(f.hdir))f.hdir=0;if(!isFinite(f.goal))f.goal=f.hdir;
    f.hdir+=wrapAng(f.goal-f.hdir)*Math.min(1,dt*5);
    let moved=false;
    for(const turn of[0,0.5,-0.5,1.1,-1.1]){const a=f.hdir+turn,nx=f.x+Math.cos(a)*spd*dt,ny=f.y+Math.sin(a)*spd*dt;if(clearAt(nx,ny,3)){f.x=nx;f.y=ny;if(turn)f.hdir+=turn*0.5;moved=true;break;}}
    if(!moved){f.think=0;for(let k=0;k<8;k++){const a=k/8*TAU;if(clearAt(f.x+Math.cos(a)*2,f.y+Math.sin(a)*2,2)){f.x+=Math.cos(a)*spd*dt;f.y+=Math.sin(a)*spd*dt;f.hdir=a;break;}}}
  }else if(f.state==='approach'){
    const dx=ROD.bx-f.x,dy=ROD.by-f.y,d=Math.hypot(dx,dy);
    if(d>3){const sp=Math.min(d,9*dt);const nx=f.x+dx/d*sp,ny=f.y+dy/d*sp;if(!solid(nx,ny)){f.x=nx;f.y=ny;}}
  }else if(f.state==='flee'){
    f.fleeT-=dt;const nx=f.x+f.vx*dt,ny=f.y+f.vy*dt;if(!solid(nx,ny)){f.x=nx;f.y=ny;}
    if(f.fleeT<=0){f.state='wander';f.tx=f.x;f.ty=f.y;}
  }
}

// ============================================================ CAVE / KAYAK
const nearDock=()=>!DREAM&&LAYER===0&&Math.hypot(K.x-DOCKPT.x,K.y-DOCKPT.y)<30;
function hitAt(x,y){for(let a=0;a<8;a++)if(solid(x+Math.cos(a*TAU/8)*5,y+Math.sin(a*TAU/8)*4))return true;return solid(x,y);}
function moveKayak(dt){
  const nx=K.x+K.vx*dt;if(hitAt(nx,K.y)){if(Math.abs(K.vx)>22)sBonk();K.vx*=-0.35;}else K.x=nx;
  const ny=K.y+K.vy*dt;if(hitAt(K.x,ny)){if(Math.abs(K.vy)>22)sBonk();K.vy*=-0.35;}else K.y=ny;
}
function ping(){
  if(G.sonarCool>0)return;
  if(G.battery<5){msg('NOT ENOUGH POWER FOR SONAR.');sErr();return;}
  if(!DREAM)G.battery-=5;G.sonarCool=1.6;SON={x:K.x,y:K.y,r:0,max:DREAM?230:140,hit:new Set()};G.pinged=true;sPing();
}
function lowerProbe(){
  let px0=K.x+Math.cos(K.ang)*12,py0=K.y+Math.sin(K.ang)*12;
  if(solid(px0,py0)){px0=K.x;py0=K.y+6;}
  K.vx=K.vy=0;K.mode='probe';
  let best=null,bd=1e9;
  for(const f of fishes){if(f.state!=='wander')continue;const dd=Math.hypot(f.x-px0,f.y-py0);if(dd<60&&dd<bd){best=f;bd=dd;}}
  PR={x:px0,y:py0,t:0,fish:best,wait:0.6+rnd()*1.4,bite:-1};
  if(best)best.state='approach';
  sProbe();addRipple(px0,py0,14);
}
function endProbe(){PR=null;K.mode='free';}
function updateProbe(dt){
  PR.t+=dt;
  if(rnd()<dt*0.8)addRipple(PR.x,PR.y,8);
  const f=PR.fish;
  if(PR.bite>=0){
    PR.bite+=dt;
    if(pressed('a')){startCatch(f);return;}
    if(PR.bite>SPECIES[f.sp].window){fishFlee(f);msg('IT GOT AWAY.');endProbe();}
    return;
  }
  const anyDir=pressed('up')||pressed('down')||pressed('left')||pressed('right');
  if(pressed('a')||pressed('b')||anyDir){if(f&&f.state==='approach')f.state='wander';endProbe();return;}
  if(f){
    if(PR.t>PR.wait){const dx=PR.x-f.x,dy=PR.y-f.y,dd=Math.hypot(dx,dy);
      if(dd<3){PR.bite=0;sBite();addRipple(PR.x,PR.y,16);}
      else{const s=Math.min(dd,16*dt);f.x+=dx/dd*s;f.y+=dy/dd*s;}}
  }else if(PR.t>4.5){msg('ONLY STATIC.');endProbe();}
}
function updateKayakFree(dt){
  const sx=(btn('right')?1:0)-(btn('left')?1:0),sy=(btn('down')?1:0)-(btn('up')?1:0);
  let ax=sy+sx/2,ay=sy-sx/2;
  const rodOut=DREAM&&ROD.state!=='idle';
  K.paddling=!!(sx||sy);
  // with the rod in his hands he can only lean and brace, not paddle
  if(K.paddling&&rodOut){const l=Math.hypot(ax,ay);K.vx+=ax/l*30*dt;K.vy+=ay/l*30*dt;}
  else if(K.paddling){const l=Math.hypot(ax,ay);ax/=l;ay/=l;K.vx+=ax*75*dt;K.vy+=ay*75*dt;K.strokeT+=dt;K.stroke+=dt*7;
    if(K.strokeT>0.45){K.strokeT=0;K.side=-K.side;sPaddle();addRipple(K.x-Math.sin(K.ang)*6*K.side,K.y+Math.cos(K.ang)*6*K.side,10);}}
  const dr=Math.pow(0.32,dt);K.vx*=dr;K.vy*=dr;
  let sp=Math.hypot(K.vx,K.vy);if(sp>48){K.vx*=48/sp;K.vy*=48/sp;sp=48;}
  moveKayak(dt);
  if(rodOut&&ROD.state==='hooked'&&ROD.fish){const ta=Math.atan2(ROD.fish.y-K.y,ROD.fish.x-K.x);K.ang+=wrapAng(ta-K.ang)*Math.min(1,dt*3);}
  else if(sp>3){const ta=Math.atan2(K.vy,K.vx);K.ang+=wrapAng(ta-K.ang)*Math.min(1,dt*5);}
  if(sp>12&&rnd()<dt*6)addRipple(K.x-Math.cos(K.ang)*9,K.y-Math.sin(K.ang)*9,8);
  if(pressed('b'))ping();
  if(pressed('a')){
    if(ROD.state==='hooked'){if(!DREAM)releaseRod('release');}
    else if(ROD.state==='bite'){hookFish(ROD.fish);}
    else if(ROD.state==='wait'){sErr();spook('TOO EARLY. IT SPOOKED.');}
    else if(nearDock()&&ROD.state==='idle'){sUIok();enterShop('dock');return;}
    else if(nearShaft()&&ROD.state==='idle'){startShaft(1);return;}
    else if(nearRope()&&ROD.state==='idle'){startShaft(-1);return;}
    else if(ROD.state==='idle'&&nearThing()){interact(nearThing());return;}
    else if(ROD.state==='idle')castRod();
  }
  if(pressed('start')&&ROD.state!=='hooked'&&!DREAM)openLog('cave');
}
function updateCave(dt){
  if(G.revealIn>0){G.revealIn-=dt;if(G.revealIn<=0){G.revealIn=0;G.state=G.revealTo||'reveal';G.revealTo=null;return;}}
  if(DREAM)maintainDream(dt);
  if(!DREAM)G.battery-=(0.42+(K.paddling?0.18:0)+(ROD.state==='hooked'?0.35:0))*dt;
  if(G.battery/G.batMax<0.2){G.alarmT-=dt;if(G.alarmT<=0){G.alarmT=2.5;sAlarm();}}
  if(G.battery<=0){G.battery=0;if(ROD.state==='hooked')releaseRod();startStranded();return;}
  G.dripT-=dt;
  if(G.dripT<=0){G.dripT=0.7+rnd()*2.4;for(let n=0;n<10;n++){const x=K.x+(rnd()-0.5)*260,y=K.y+(rnd()-0.5)*260;if(!solid(x,y)){addRipple(x,y,14);sDrip(clamp(1-Math.hypot(x-K.x,y-K.y)/260,0.15,1));break;}}}

function updateCatch(dt){
  C.t+=dt;
  if(C.done){C.doneT+=dt;if(C.doneT>1.5)finishCatch();return;}
  const fine=(btn('right')?1:0)-(btn('left')?1:0);
  const coarse=(btn('r')?1:0)-(btn('l')?1:0)+(btn('up')?1:0)-(btn('down')?1:0);
  if(fine){C.fineHold+=dt;G.pf+=fine*(0.07+Math.min(C.fineHold,1.2)*0.32)*dt;}else C.fineHold=0;
  if(coarse)G.pf+=Math.sign(coarse)*1.1*dt;
  G.pf=clamp(G.pf,1,6);
  if(Math.abs(G.pf-C.knobRef)>0.02){C.knobRef=G.pf;sKnob();}
  behave(dt);
  const tol=0.09*(G.up.valve?1.5:1),was=C.locked;
  // once locked, the receiver's phase-lock loop gently pulls your dial along with the fish
  if(C.locked&&!fine&&!coarse)G.pf+=(C.f-G.pf)*Math.min(1,dt*(G.up.valve?3.2:2.2));
  const dd=Math.abs(G.pf-C.f);
  if(C.locked){if(dd>tol*1.7){C.grace+=dt;if(C.grace>0.6)C.locked=false;}else C.grace=0;}
  else if(dd<tol){C.locked=true;C.grace=0;}
  C.q=clamp(1-dd/(tol*1.7),0,1);
  if(C.locked&&!was)sLock();if(!C.locked&&was)sUnlock();
  if(C.locked){C.phi+=wrapAng(Math.PI/2-C.phi)*Math.min(1,dt*4);}else C.phi+=TAU*(G.pf-C.f)*1.4*dt;
  const holding=btn('a'),tm=G.up.squelch?0.6:1;
  if(holding){
    if(C.locked){C.prog+=dt*0.18*(0.7+0.3*C.q)/C.sp.strength;C.ten=Math.max(0,C.ten-dt*0.2);C.reelT+=dt;if(C.reelT>0.09){C.reelT=0;sReel();}}
    else C.ten+=dt*0.5*tm;
  }else{C.ten=Math.max(0,C.ten-dt*0.35);C.prog=Math.max(0,C.prog-dt*0.015);}
  const b=Math.floor(C.prog*10);if(b>C.lastBulb){sBulb();}C.lastBulb=b;
  G.battery-=0.8*dt;
  if(G.battery<=0){G.battery=0;C.done='power';sPowerDown();stopCatchAudio();musicStop();}
  else if(C.ten>=1){C.ten=1;C.done='snap';sSnap();stopCatchAudio();musicStop();}
  else if(C.prog>=1){C.prog=1;C.done='caught';sCatch();stopCatchAudio();musicStop();}
  else if(pressed('b')){C.done='cut';sUnlock();stopCatchAudio();musicStop();}

}
function finishCatch(){

  rect(8,18,304,1,P.ink);rect(116,22,1,192,P.ink);
  ORDER.forEach((k,i)=>{const caught=G.log[k].n>0,y=26+i*13,sel=i===LG.sel;
    drawText((sel?'> ':'  ')+(caught?SPECIES[k].name:'???'),10,y,caught?P.ink:P.gray);

  drawText(caught?sp.type.split(' - ')[1]||'':'',180,50,P.gray);
  drawText(caught?`CAUGHT ${lg.n}  BEST ${lg.best} CM`:'NO CONTACT YET',180,62,P.gray);

  if(caught){
    if(!G.up.tape)drawText('TAPE: NEEDS A MAGNETOPHONE',124,170,P.gray);
    else if(LG.tapeT<0||LG.key!==key)drawText('A: PLAY TAPE',124,170,P.mag);
    else{
      if(LG.tapeT<2.7){if((T*3|0)%2)drawText('INTERVAL SIGNAL...',124,170,P.mag);}
      else{drawText('ВНИМАНИЕ. ВНИМАНИЕ.',124,170,P.mag);const toks=sp.tape.split(' ');const n=clamp(Math.floor((LG.tapeT-3.6)/0.85)+1,0,toks.length);drawText(toks.slice(0,n).join('  '),124,184,P.ink,2);}
    }
  }
  drawText('UP/DOWN SELECT    A: PLAY TAPE    B: BACK',160,224,P.gray,1,'center');
}

    case 'intro':updateIntro(dt);break;
    case 'cave':updateCave(dt);break;
    case 'catch':updateCatch(dt);break;
    case 'reveal':updateReveal(dt);break;
    case 'shop':updateShop(dt);break;
    case 'log':updateLog(dt);break;
    case 'stranded':updateStranded(dt);break;
    case 'ending':updateEnding(dt);break;
    case 'shaft':updateShaft(dt);break;
    case 'patch':updatePatch(dt);break;
    case 'thought':updateThought(dt);break;

  }
}
