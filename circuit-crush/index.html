addEventListener('touchend',function(e){if(x0===null)return;var t=e.changedTouches[0];if(t.clientX-x0>90&&Math.abs(t.clientY-y0)<80)location.href='../';x0=null;},{passive:true,capture:true});

<title>Circuit Crush · ELC 131 Boss Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#5c4078;--ink2:#8b72a8;--cream:#fffaf5;--lemon:#fff1a8;--sky:#bfe2ff;--pink:#ffc9dc;--mint:#bff2da;--lav:#dccbff;--peach:#ffd9bd;--coral:#ff9fb0;--good:#8fe3bf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fbeef6;font-family:Nunito,system-ui,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
body{font-size:clamp(12.5px,1.55vmin + 7px,21px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#shake{position:fixed;inset:0;will-change:transform}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:6}
#ui{position:absolute;inset:0;z-index:2;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:none;padding:inherit}
.screen.on{display:flex}
.fred{font-family:Fredoka,Nunito,sans-serif}

/* ---------- title ---------- */
#title{flex-direction:column;align-items:center;justify-content:center;gap:1.1em;text-align:center;padding-bottom:18vh}
.logo{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;font-size:clamp(40px,11vmin,110px);line-height:.95;letter-spacing:.01em}
.logo span{display:inline-block;animation:bob 1.6s ease-in-out infinite;text-shadow:0 .06em 0 rgba(92,64,120,.18),0 0 .5em rgba(255,255,255,.9);-webkit-text-stroke:.035em #fff;paint-order:stroke fill}
.logo .sp{width:.3em}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-.12em) rotate(2deg)}}
.sub{font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:.8em;color:var(--ink2);background:rgba(255,255,255,.7);padding:.45em 1.1em;border-radius:99px}
.press{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:600;font-size:1.25em;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.96)}}
.padStatus{font-size:.8em;font-weight:700;background:rgba(255,255,255,.75);border-radius:99px;padding:.4em 1em;color:var(--ink2)}
.padStatus.ok{background:var(--mint);color:var(--ink)}

/* ---------- map ---------- */
#map{flex-direction:column;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.mapTop{display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.mapTop h2{margin:0;font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;font-size:1.45em;background:rgba(255,255,255,.75);padding:.2em .8em;border-radius:99px}
.pill{background:rgba(255,255,255,.8);border-radius:99px;padding:.35em .9em;font-weight:800;font-size:.85em}
.mapInfo{align-self:center;background:rgba(255,255,255,.85);border-radius:22px;padding:.6em 1.2em;display:flex;align-items:center;gap:1em;box-shadow:0 6px 0 rgba(92,64,120,.08),0 10px 30px rgba(92,64,120,.12);max-width:96vw}
.mapInfo .mi-name{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;font-size:1.3em;line-height:1.1}
.mapInfo .mi-sub{font-size:.82em;font-weight:700;color:var(--ink2)}
.mapInfo .go{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;background:var(--mint);border-radius:14px;padding:.45em .9em;box-shadow:0 4px 0 #8fd4b4;display:flex;align-items:center;gap:.4em;white-space:nowrap;animation:pulse 1.4s infinite}
.grade{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;display:inline-grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px currentColor}

/* ---------- battle ---------- */
#battle{flex-direction:column;padding:calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
#hud{display:flex;align-items:center;gap:8px;height:2.6em;flex:0 0 auto}
.ib{width:2.2em;height:2.2em;border-radius:12px;background:rgba(255,255,255,.8);display:grid;place-items:center;font-weight:900;box-shadow:0 3px 0 rgba(92,64,120,.12);font-size:.95em;flex:0 0 auto}
.ib:active{transform:translateY(2px);box-shadow:none}
.ib.off{opacity:.35}
.bossbar{flex:1;min-width:0}
.bname{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;font-size:.85em;line-height:1;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname small{font-family:Nunito,system-ui,sans-serif;font-weight:800;color:var(--ink2);margin-left:.4em}
.hp{position:relative;height:.8em;border-radius:99px;background:rgba(255,255,255,.75);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.hp div{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.hpLag{background:#fff;transition:width .6s .25s cubic-bezier(.3,.8,.3,1)}
.hpFill{background:linear-gradient(90deg,#ff9fc0,#ffc3a0,#ffe39a);transition:width .12s}
.combo{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;min-width:3.3em;text-align:center;background:rgba(255,255,255,.8);border-radius:12px;padding:.2em .5em;line-height:1.05;font-size:.95em}
.combo small{display:block;font-size:.55em;letter-spacing:.12em;color:var(--ink2)}
.combo.pop{animation:cpop .35s}
@keyframes cpop{0%{transform:scale(1.5) rotate(-8deg)}100%{transform:scale(1)}}
body.fever .combo{background:linear-gradient(90deg,#ffc9dc,#fff1a8,#bff2da,#bfe2ff,#dccbff,#ffc9dc);background-size:300% 100%;animation:rb 1.2s linear infinite}
@keyframes rb{to{background-position:300% 0}}
.score{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;min-width:3.8em;text-align:right;font-size:1.05em}

#main{flex:1;display:grid;grid-template-columns:40% 1fr;gap:10px;min-height:0;padding-top:4px}
#left{display:flex;flex-direction:column;min-height:0;gap:6px}
#bossSlot{flex:1 1 30%;min-height:70px;position:relative}
#figCard{flex:0 1 auto;min-height:0;max-height:66%;background:rgba(255,253,249,.88);border-radius:18px;padding:6px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 5px 0 rgba(92,64,120,.08);cursor:zoom-in}
#figCard.none{display:none}
#figCard img{max-width:100%;max-height:100%;object-fit:contain;display:block;min-height:0}
.zoomTag{position:absolute;right:6px;bottom:4px;font-size:.62em;font-weight:900;background:var(--lav);border-radius:99px;padding:.15em .55em;opacity:.9}
#right{display:flex;flex-direction:column;min-height:0;gap:6px;position:relative}
#qCard{flex:0 0 auto;background:rgba(255,255,255,.88);border-radius:18px;padding:.55em 3em .6em .85em;position:relative;box-shadow:0 5px 0 rgba(92,64,120,.08);animation:qin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes qin{0%{transform:translateY(-14px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
.qTag{font-size:.68em;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.qText{font-weight:800;line-height:1.28;font-size:1em}
.hintBox{display:none;margin-top:.35em;font-weight:800;font-size:.88em;background:var(--lemon);border-radius:10px;padding:.25em .6em;animation:qin .35s}
.hintBox.on{display:block}
#ring{position:absolute;right:.45em;top:.45em;width:2.3em;height:2.3em}
#ring circle{fill:none;stroke-width:4}
#ring .trk{stroke:rgba(92,64,120,.1)}
#ring .bar{stroke:#ffb3cb;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
#ring text{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;font-size:11px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}

#answers{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:6px 8px}
.ans{position:relative;border-radius:16px;padding:.3em .7em .3em 2.1em;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:600;font-size:1.02em;line-height:1.15;min-height:0;cursor:pointer;
 box-shadow:0 5px 0 var(--sh),0 8px 18px rgba(92,64,120,.1);transition:transform .14s cubic-bezier(.3,1.6,.5,1),box-shadow .14s,opacity .2s,filter .2s;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.ans .at{min-width:0;overflow:hidden}
.pw{position:absolute;left:1.9em;right:.45em;top:.3em;bottom:.3em;border-radius:10px;overflow:hidden}.fbPW{position:relative;height:5.8em;margin:.2em 0;background:#fff;border-radius:10px;overflow:hidden}
.ans.hasPlot{padding:.25em .4em .25em 1.9em}
.ans[data-slot="0"]{grid-column:1/3;grid-row:1;justify-self:center;width:62%;background:var(--lemon);--sh:#ead98a}
.ans[data-slot="1"]{grid-column:1;grid-row:2;background:var(--sky);--sh:#9ccbef}
.ans[data-slot="2"]{grid-column:2;grid-row:2;background:var(--pink);--sh:#efa9c2}
.ans[data-slot="3"]{grid-column:1/3;grid-row:3;justify-self:center;width:62%;background:var(--mint);--sh:#9ad8bb}
@keyframes pop{0%{transform:scale(.3) translateY(20px);opacity:0}100%{transform:none;opacity:1}}
.ans.sel{transform:translateY(-3px) scale(1.05);box-shadow:0 8px 0 var(--sh),0 0 0 3px #fff,0 0 22px 6px rgba(255,255,255,.95);z-index:2}
.ans .lockTip{position:absolute;left:50%;bottom:-.55em;transform:translateX(-50%);font-family:Nunito,system-ui,sans-serif;font-weight:900;font-size:.55em;background:var(--ink);color:#fff;border-radius:99px;padding:.15em .7em;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;letter-spacing:.04em}
.ans.sel .lockTip{opacity:1;animation:pulse .8s infinite}
.ans.lock{transform:scale(.94);box-shadow:0 1px 0 var(--sh)}
.ans.right{background:var(--good)!important;--sh:#62c79c!important;animation:yay .6s cubic-bezier(.2,1.6,.4,1)}
.ans.reveal{background:var(--good)!important;--sh:#62c79c!important;box-shadow:0 5px 0 var(--sh),0 0 0 3px #fff,0 0 18px 4px rgba(143,227,191,.9)}
.ans.wrong{background:var(--coral)!important;--sh:#e57d90!important;animation:no .5s}
.ans.dim{opacity:.38;filter:saturate(.5)}
@keyframes yay{0%{transform:scale(.9)}40%{transform:scale(1.14) rotate(-2deg)}100%{transform:scale(1.04)}}
@keyframes no{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.gl{position:absolute;left:.55em;top:50%;transform:translateY(-50%);width:1.15em;height:1.15em;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr)}
.gl i{width:.36em;height:.36em;border-radius:50%;background:rgba(92,64,120,.22);place-self:center}
.gl i:nth-child(1){grid-area:1/2}.gl i:nth-child(2){grid-area:2/1}.gl i:nth-child(3){grid-area:2/3}.gl i:nth-child(4){grid-area:3/2}
.gl i.on{background:var(--ink);box-shadow:0 0 0 2px #fff}
.gl.inl{position:relative;left:0;top:0;transform:none;display:inline-grid;vertical-align:-.2em}

#fb{position:absolute;left:0;right:0;bottom:0;top:0;background:rgba(255,253,250,.97);border-radius:20px;padding:.7em .9em 3em;overflow:auto;display:none;box-shadow:0 10px 40px rgba(92,64,120,.2);touch-action:pan-y;z-index:4}
#fb.on{display:block;animation:fbin .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes fbin{0%{transform:translateY(40px) scale(.95);opacity:0}100%{transform:none;opacity:1}}
.fbHead{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;font-size:1.35em;display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap}
.fbHead.good{color:#3a9f74}.fbHead.bad{color:#e0607a}
.fbHead small{font-family:Nunito,system-ui,sans-serif;font-size:.55em;font-weight:900;color:var(--ink2);letter-spacing:.08em}
.fbAns{margin:.3em 0 .35em;font-weight:800}
.fbAns b{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:600;background:var(--mint);border-radius:8px;padding:.05em .45em}
.fbSol{margin:0;padding:.45em .7em .45em 1.8em;background:#f6f0ff;border-radius:14px;font-weight:700;line-height:1.45;font-size:.92em}
.fbSol li::marker{color:var(--ink2);font-weight:900}
.fbNext{position:sticky;bottom:-2.4em;margin-top:.7em;float:right;font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;background:var(--lemon);border-radius:14px;padding:.4em 1em;box-shadow:0 4px 0 #ead98a;display:flex;align-items:center;gap:.5em}
#legend{flex:0 0 auto;height:1.6em;display:flex;align-items:center;justify-content:center;gap:1.1em;font-size:.7em;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden}
#legend b{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;background:rgba(255,255,255,.85);border-radius:6px;padding:0 .4em;color:var(--ink)}
#bubble{position:absolute;z-index:5;background:#fff;border-radius:16px;padding:.4em .75em;font-weight:800;font-size:.8em;max-width:15em;box-shadow:0 6px 18px rgba(92,64,120,.18);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
#bubble.on{opacity:1;transform:none}
#bubble:after{content:"";position:absolute;left:25%;bottom:-8px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}

/* overlays */
.overlay{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(92,64,120,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.overlay.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{background:var(--cream);border-radius:26px;padding:1.1em 1.4em;box-shadow:0 10px 0 rgba(92,64,120,.1),0 20px 60px rgba(92,64,120,.25);text-align:center;animation:cardin .45s cubic-bezier(.2,1.5,.4,1);max-width:94vw;max-height:94vh;overflow:auto}
@keyframes cardin{0%{transform:scale(.6) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.card h3{margin:0 0 .5em;font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-size:1.5em}
.menu{display:flex;flex-direction:column;gap:.45em;min-width:13em}
.menu button{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:600;font-size:1.05em;padding:.5em 1em;border-radius:14px;background:#fff;box-shadow:0 4px 0 rgba(92,64,120,.12);transition:transform .12s}
.menu button.cur{background:var(--lav);transform:scale(1.06);box-shadow:0 4px 0 #b9a2e6}
#zoom{background:rgba(255,250,245,.96);flex-direction:column;gap:.5em}
#zoom img{max-width:96vw;max-height:84vh;object-fit:contain}
#zoom div{font-weight:800;font-size:.8em;color:var(--ink2)}
#victory{z-index:7}
.vTitle{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;font-size:1.6em;letter-spacing:.02em}
.stamp{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;font-size:4.2em;line-height:1;width:1.5em;height:1.5em;margin:.08em auto .12em;display:grid;place-items:center;border-radius:50%;border:.08em solid currentColor;background:#fff;animation:stamp .6s .25s cubic-bezier(.3,1.4,.5,1) both;transform:rotate(-8deg)}
@keyframes stamp{0%{transform:scale(3.2) rotate(-30deg);opacity:0}70%{transform:scale(.92) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.gS{color:#e58bd0}.gA{color:#6fb7e8}.gB{color:#5fc59b}.gC{color:#e8b25f}.gD{color:#e8807f}
.stats{display:grid;grid-template-columns:auto auto;gap:.15em 1.2em;font-weight:800;margin:.3em auto .7em;width:max-content;text-align:left}
.stats span:nth-child(even){font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;text-align:right}
.vBtns{display:flex;gap:.6em;justify-content:center}
.vBtns button{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;padding:.45em 1em;border-radius:14px;background:var(--mint);box-shadow:0 4px 0 #9ad8bb;display:flex;gap:.45em;align-items:center}
.vBtns button.alt{background:var(--sky);box-shadow:0 4px 0 #9ccbef}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-150%);background:#fff;border-radius:99px;padding:.45em 1.1em;font-weight:800;font-size:.85em;box-shadow:0 6px 20px rgba(92,64,120,.2);z-index:9;transition:transform .35s cubic-bezier(.2,1.5,.4,1),opacity .2s;white-space:nowrap;opacity:0;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}

/* lessons */
#lesson{z-index:8;background:rgba(92,64,120,.28)}
.lcard{width:min(96vw,1000px);height:min(94vh,600px);background:var(--cream);border-radius:24px;padding:10px;display:grid;grid-template-columns:46% 1fr;gap:12px;box-shadow:0 10px 0 rgba(92,64,120,.1),0 20px 60px rgba(92,64,120,.25)}
.lcard.flip{animation:cardin .4s cubic-bezier(.2,1.4,.4,1)}
.lvizBox{position:relative;background:#fff;border-radius:18px;overflow:hidden;min-height:0}
.ltext{display:flex;flex-direction:column;min-height:0;padding:2px 2px 0 0}
.lstep{font-size:.68em;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
#lTitle{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;font-size:1.35em;margin:0 0 .15em;line-height:1.1}
#lBody{flex:1;min-height:0;overflow:auto;font-weight:700;line-height:1.38;touch-action:pan-y;font-size:.95em;padding-right:4px}
.lform{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:600;background:var(--lemon);border-radius:12px;padding:.25em .7em;margin:.45em 0 0;display:inline-block}
.lwhy{margin-top:.45em;background:var(--mint);border-radius:12px;padding:.3em .7em;font-weight:800;font-size:.9em}
.lnav{display:flex;align-items:center;justify-content:space-between;gap:.5em;padding-top:.35em}
.lnav button{font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;border-radius:14px;padding:.35em .9em;display:flex;align-items:center;gap:.4em;white-space:nowrap}
#lNext{background:var(--lemon);box-shadow:0 4px 0 #ead98a}
#lPrev{background:#fff;box-shadow:0 4px 0 rgba(92,64,120,.12)}
#lDots{display:flex;gap:5px}#lDots i{width:8px;height:8px;border-radius:99px;background:rgba(92,64,120,.2);transition:width .2s}#lDots i.on{background:var(--ink);width:20px}
body.portrait .lcard{grid-template-columns:1fr;grid-template-rows:38% 1fr}
.fbOops{background:#ffe3e8;border-radius:12px;padding:.35em .7em;font-weight:800;margin:.35em 0;font-size:.92em}
.fbIdea{background:#e6faf0;border-radius:12px;padding:.35em .7em;font-weight:700;margin:.35em 0;font-size:.92em}
.fbIdea b.k,.fbOops b.k{font-family:Fredoka,Nunito,sans-serif;font-weight:700;margin-right:.3em}
.mi-btns{display:flex;gap:.5em}
.mapInfo .go.learn{background:var(--sky);box-shadow:0 4px 0 #9ccbef;animation:none}

/* circuit lab */
#lab{flex-direction:column;padding:calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
#labHud{display:flex;align-items:center;gap:8px;height:2.6em;flex:0 0 auto}
.labTitle{flex:1;min-width:0;font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;font-weight:700;font-size:.95em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labTitle small{display:block;font-family:Nunito,system-ui,sans-serif;font-weight:800;font-size:.75em;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
#labArea{flex:1;min-height:0;cursor:pointer}
#labMsg{flex:0 0 auto;min-height:2.3em;background:rgba(255,255,255,.9);border-radius:14px;padding:.3em .8em;font-weight:800;font-size:.84em;display:flex;align-items:center;gap:.8em;line-height:1.25;box-shadow:0 4px 0 rgba(92,64,120,.08);animation:qin .35s}
#labMsg.good{background:#e3f9ee}#labMsg.bad{background:#ffe1e7}
#labMsgTxt{flex:1;min-width:0}
#labCtl{font-size:.82em;color:var(--ink2);white-space:nowrap}
#labCtl b{font-family:Fredoka,Nunito,sans-serif;background:#fff;border-radius:6px;padding:0 .35em;color:var(--ink)}
#labChoice{position:absolute;bottom:calc(3.4em + env(safe-area-inset-bottom));width:min(46vw,360px);height:min(56vh,12em);display:none;flex-direction:column;gap:5px;background:rgba(255,250,245,.94);border-radius:20px;padding:8px;box-shadow:0 10px 30px rgba(92,64,120,.22);z-index:4;animation:cardin .3s cubic-bezier(.2,1.4,.4,1)}
#labChoice.on{display:flex}#labChoice.right{right:calc(12px + env(safe-area-inset-right))}#labChoice.left{left:calc(12px + env(safe-area-inset-left))}
#lcTitle{font-weight:800;font-size:.8em;text-align:center}
.lcG{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:5px 6px;flex:1;min-height:0}
.lcG .ans{font-size:.95em}
.ans .at small{display:block;font-family:Nunito,system-ui,sans-serif;font-size:.62em;font-weight:800;opacity:.7}
body.portrait #labChoice{width:min(92vw,360px);left:50%!important;right:auto!important;transform:translateX(-50%)}

.starsBig{font-size:2.3em;color:#e8a93a;letter-spacing:.08em;margin:.15em 0 .1em;animation:starpop .6s .25s cubic-bezier(.3,1.5,.5,1) both;text-shadow:0 3px 0 rgba(232,169,58,.25)}
@keyframes starpop{0%{transform:scale(2.6);opacity:0}100%{transform:none;opacity:1}}
/* portrait */
body.portrait #main{grid-template-columns:1fr;grid-template-rows:minmax(0,34%) 1fr}
body.portrait #left{flex-direction:row}
body.portrait #bossSlot{flex:0 0 34%}
body.portrait #figCard{flex:1;max-height:100%}
body.portrait #figCard.none+*{}
body.portrait .ans[data-slot="0"],body.portrait .ans[data-slot="3"]{width:70%}
body.portrait #legend{font-size:.62em;gap:.7em}
body.short #legend{display:none}
</style>
</head>
<body>
<div id="shake">
<canvas id="bg"></canvas>
<div id="ui">
  <section id="title" class="screen on">
    <div class="logo" id="logo"></div>
    <div class="sub">ELC 131 · Boss Rush Study Mode</div>
    <div class="press" id="pressTxt">Press any button ✦ or tap</div>
    <div class="padStatus" id="padStatus">🎮 Controller not seen yet — press a button on it</div>
  </section>

  <section id="map" class="screen">
    <div class="mapTop"><h2>Pick a boss</h2><div class="pill" id="mapScore">✦ 0</div></div>
    <div class="mapInfo" id="mapInfo"></div>
  </section>

  <section id="battle" class="screen">
    <header id="hud">
      <button class="ib" id="bPause" aria-label="Pause">❚❚</button>
      <div class="bossbar"><div class="bname" id="bName"></div><div class="hp"><div class="hpLag" id="hpLag"></div><div class="hpFill" id="hpFill"></div></div></div>
      <button class="ib" id="bHint" aria-label="Hint">💡</button>
      <button class="ib" id="bSkip" aria-label="Skip question">⏭</button>
      <div class="combo" id="combo">x0<small>COMBO</small></div>
      <div class="score" id="score">0</div>
    </header>
    <div id="main">
      <div id="left"><div id="bossSlot"></div><div id="figCard" class="none"><img id="figImg" alt="circuit figure"><span class="zoomTag">🔍 zoom</span></div></div>
      <div id="right">
        <div id="qCard"><div class="qTag" id="qTag"></div><div class="qText" id="qText"></div><div class="hintBox" id="hintBox"></div>
          <svg id="ring" viewBox="0 0 36 36"><circle class="trk" cx="18" cy="18" r="15"/><circle class="bar" id="ringBar" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="0"/><text x="18" y="18" id="ringTxt">+100</text></svg>
        </div>
        <div id="answers"></div>
        <div id="fb"></div>
      </div>
    </div>
    <footer id="legend"></footer>
    <div id="bubble"></div>
  </section>

  <section id="lab" class="screen">
    <header id="labHud"><button class="ib" id="labPause" aria-label="Pause">❚❚</button><div class="labTitle" id="labTitle"></div><div class="pill" id="labStats"></div><button class="ib" id="labSkipBtn" aria-label="Skip puzzle">⏭</button><button class="ib" id="labHintBtn" aria-label="Hint">💡</button></header>
    <div id="labArea"></div>
    <div id="labMsg"><span id="labMsgTxt"></span><span id="labCtl"></span></div>
    <div id="labChoice"><div id="lcTitle"></div><div class="lcG" id="lcGrid"></div></div>
  </section>

  <div id="pause" class="overlay"><div class="card"><h3>Paused</h3><div class="menu" id="pauseMenu"></div></div></div>
  <div id="victory" class="overlay"></div>
  <div id="lesson" class="overlay"><div class="lcard" id="lCard"><div class="lvizBox"><canvas id="lViz"></canvas></div>
    <div class="ltext"><div class="lstep" id="lStep"></div><h3 id="lTitle"></h3><div id="lBody"></div>
    <div class="lnav"><button id="lPrev"></button><div id="lDots"></div><button id="lNext"></button></div></div></div></div>
  <div id="zoom" class="overlay"><img id="zoomImg" alt="zoomed figure"><div>press any button / tap to close</div></div>
  <div id="toast"></div>
</div>
<canvas id="fx"></canvas>
</div>

const VINK='#5c4078';
function vT(c,s,x,y,size,col=VINK,align='center',weight=700){c.font=`${weight} ${size}px Fredoka, Nunito, system-ui, sans-serif`;c.fillStyle=col;c.textAlign=align;c.textBaseline='middle';c.fillText(s,x,y)}
function vWave(c,x0,x1,yc,amp,cycles,phase,col,lw=3,upto=1){c.beginPath();const n=240;for(let i=0;i<=n*upto;i++){const s=i/n;const X=lerp(x0,x1,s),Y=yc-Math.sin(s*cycles*Math.PI*2+phase)*amp;i?c.lineTo(X,Y):c.moveTo(X,Y)}c.strokeStyle=col;c.lineWidth=lw;c.lineJoin='round';c.lineCap='round';c.stroke()}

/* ===================================================================== CIRCUIT LAB (v2)
   Tree nodes: S / P (series, parallel), E (part: kind R|L|C, value v), X (transformer: ratio a = Np/Ns, kids:[load])
   Transient while normalising: W (wire / short), O (gap / open)
   ===================================================================== */
let NID=1;
const E_=(kind,v)=>({t:'E',kind,v,id:NID++});
function SP(t,kids){ const out=[]; for(const k of kids){ if(k.t===t) out.push(...k.kids); else out.push(k) } return out.length===1?out[0]:{t,kids:out,id:NID++} }
const Sx=(...k)=>SP('S',k), Px=(...k)=>SP('P',k);
const Rx=v=>E_('R',v), Lx=v=>E_('L',v), Cx=v=>E_('C',v), Xf=(ratio,load,lab)=>({t:'X',ratio,lab,kids:[load],id:NID++});
const k_=1e3, u_=1e-6, m_=1e-3;
function nameTree(root){ const cnt={R:0,L:0,C:0}; (function walk(n){ if(n.t==='E'){ n.d=[++cnt[n.kind]]; n.name=n.kind+n.d[0] } else if(n.kids) n.kids.forEach(walk) })(root); return root }
function leavesOf(n,out=[]){ if(n.t==='E') out.push(n); else if(n.kids) n.kids.forEach(k=>leavesOf(k,out)); return out }
function xfsOf(n,out=[]){ if(n.t==='X') out.push(n); if(n.kids) n.kids.forEach(k=>xfsOf(k,out)); return out }
function parentMap(root){ const m=new Map(); (function walk(n){ if(n.kids) n.kids.forEach(k=>{m.set(k,n);walk(k)}) })(root); return m }
function ancestorsOf(n,pm){ const a=[]; let p=pm.get(n); while(p){a.push(p);p=pm.get(p)} return a }
function relation(root,a,b){ const pm=parentMap(root), pa=pm.get(a), pb=pm.get(b), A=ancestorsOf(a,pm), Bl=ancestorsOf(b,pm);
 const xa=A.find(x=>x.t==='X'), xb=Bl.find(x=>x.t==='X'); if(xa!==xb) return {rel:'N',xf:true};
 if(pa&&pa===pb&&pa.t!=='X') return {rel:pa.t,parent:pa};
 const B=new Set(Bl); return {rel:'N',lca:A.find(x=>B.has(x))} }
function mergeablePairs(root){ const out=[]; (function walk(n){ if(!n.kids) return; if(n.t==='S'||n.t==='P'){ const ls=n.kids.filter(k=>k.t==='E');
 for(let i=0;i<ls.length;i++) for(let j=i+1;j<ls.length;j++) if(ls[i].kind===ls[j].kind) out.push([ls[i],ls[j],n.t]) } n.kids.forEach(walk) })(root); return out }
function normalizeT(n){
 if(n.t==='X'){ n.kids=[normalizeT(n.kids[0])]; return n }
 if(n.t!=='S'&&n.t!=='P') return n;
 let kids=n.kids.map(normalizeT);
 if(n.t==='S'){ if(kids.some(k=>k.t==='O')) return {t:'O'}; kids=kids.filter(k=>k.t!=='W'); if(!kids.length) return {t:'W'} }
 else { if(kids.some(k=>k.t==='W')) return {t:'W'}; kids=kids.filter(k=>k.t!=='O'); if(!kids.length) return {t:'O'} }
 const flat=[]; for(const k of kids){ if(k.t===n.t) flat.push(...k.kids); else flat.push(k) }
 if(flat.length===1) return flat[0]; n.kids=flat; return n }
function cloneT(n){ return n.t==='E'?{...n,d:[...(n.d||[])]}:{...n,kids:n.kids?n.kids.map(cloneT):undefined} }
function labelOf(kind,d){ return kind+(d.length<=3?d.join(''):'eq') }
const addRule=(kind,rel)=>(rel==='S')!==(kind==='C'); // true → "add", false → "product ÷ sum"
function combineVal(kind,rel,a,b){ if(a==null||b==null) return null; return addRule(kind,rel)?a+b:a*b/(a+b) }
function mergeLeaves(root,a,b,rel){ const p=parentMap(root).get(a); const d=[...a.d,...b.d].sort((x,y)=>x-y);
 const nl={t:'E',kind:a.kind,id:NID++,d,name:labelOf(a.kind,d),pop:1,how:rel,v:combineVal(a.kind,rel,a.v,b.v)};
 p.kids[p.kids.indexOf(a)]=nl; p.kids.splice(p.kids.indexOf(b),1); return {root:normalizeT(root),nl} }
function replaceNode(root,target,repl){ if(root===target) return repl; const p=parentMap(root).get(target); p.kids[p.kids.indexOf(target)]=repl; return root }
function fmtVal(kind,v){ if(v==null) return ''; const u={R:'Ω',L:'H',C:'F'}[kind];
 const pre=[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']]; for(const [f,p] of pre){ if(Math.abs(v)>=f*.9999){ const x=v/f; return `${+x.toPrecision(3)} ${p}${u}` } } return `${+v.toPrecision(3)} ${u}` }
function fmtTime(s){ return s>=1?`${+s.toPrecision(3)} s`:s>=1e-3?`${+(s*1e3).toPrecision(3)} ms`:`${+(s*1e6).toPrecision(3)} µs` }

/* ---------- layout ---------- */
const LPAD=.32;
function measureT(n){ if(n.t==='E'){n.w=1;n.h=1;n.a=.5;return}
 if(n.t==='X'){ const L=n.kids[0]; measureT(L); n.w=Math.max(1.5,L.w+.9); n.h=1.4+L.h+.15; n.a=.5; return }
 n.kids.forEach(measureT);
 if(n.t==='S'){ n.a=Math.max(...n.kids.map(k=>k.a)); n.w=n.kids.reduce((s,k)=>s+k.w,0); n.h=Math.max(...n.kids.map(k=>n.a-k.a+k.h)) }
 else { n.w=Math.max(...n.kids.map(k=>k.w))+2*LPAD; n.h=n.kids.reduce((s,k)=>s+k.h,0); n.a=n.kids[0].a } }
function placeT(n,x,y,I,segs,dots){ n.x=x;n.y=y;n.I=I;
 if(n.t==='E'){ n.cx=x+.5; n.cy=y+.5; segs.push([x,n.cy,x+.19,n.cy,I],[x+.81,n.cy,x+1,n.cy,I]); return }

   const lx=x+.45, ly=y+1.4+L.a; placeT(L,lx,y+1.4,I,segs,dots);
   segs.push([cx-.31,ys,x+.14,ys,I],[x+.14,ys,x+.14,ly,I],[x+.14,ly,lx,ly,I],[lx+L.w,ly,x+n.w-.14,ly,I],[x+n.w-.14,ly,x+n.w-.14,ys,I],[x+n.w-.14,ys,cx+.31,ys,I]);
   // flow direction in the loop is cosmetic
   return }
 if(n.t==='S'){ let cx=x; for(const k of n.kids){ placeT(k,cx,y+n.a-k.a,I,segs,dots); cx+=k.w } return }

 n.kids.forEach(k=>{ const ki=I/m; placeT(k,x+LPAD,cy,ki,segs,dots); const ay=cy+k.a; ys.push(ay);
   segs.push([x,ay,x+LPAD,ay,ki]); segs.push([x+LPAD+k.w,ay,x+n.w,ay,ki]); dots.push([x,ay],[x+n.w,ay]); cy+=k.h });
 for(let j=0;j<m-1;j++){ segs.push([x,ys[j],x,ys[j+1],I*(m-1-j)/m]); segs.push([x+n.w,ys[j+1],x+n.w,ys[j],I*(j+1)/m]) } }
function layoutCircuit(root){ measureT(root); const segs=[],dots=[]; placeT(root,1,0,1,segs,dots);
 const a=root.a, right=1+root.w, rx=right+.35, by=root.h+.22, sx=.5, my=(a+by)/2;

 return {segs,dots,W:rx+.3,H:by+.12,src:{x:sx,y:my},top:-.05} }

/* ---------- drawing ---------- */
const KCOL={R:'#ffe1c9',L:'#d2f5e4',C:'#d6ecff'}, KINK={R:'#a85f2c',L:'#3f9f78',C:'#4f8fc8'}, KNAME={R:'resistor',L:'inductor',C:'capacitor'};

 c.font=F(fs); const w1=c.measureText(k).width; c.font=F(fs*.7); const w2=c.measureText(d).width; const x0=x-(w1+w2)/2; c.fillStyle=col; c.textAlign='left';

function drawCircuit(c,root,rx,ry,rw,rh,o={}){ const Lc=layoutCircuit(root); const U=Math.min(rw/Lc.W,rh/(Lc.H-Lc.top),o.maxU||125);

LESSONS.lab=[
 {t:'Series = one path', viz:'labS', body:'Two parts are in <b>series</b> when they sit on the same single path, one after the other, with <b>nothing branching off between them</b>. Every bit of current through one goes through the other.', why:'Test: could current get around one of them without passing through the other? If not → series.'},
 {t:'Parallel = same two nodes', viz:'labP', body:'Two parts are in <b>parallel</b> when <b>both ends</b> are wired to each other — they share the same two nodes. Current splits between them, but they get the <b>same voltage</b>.', why:'Test: trace from each end of one part. Only wire between you and the other part\'s ends? → parallel.'},
 {t:'Neither (yet)', viz:'labN', body:'R1 and R3 look side by side, but each has a partner in series on its own branch. Their ends don\'t meet at the same two nodes, and they don\'t carry the same current → <b>neither</b>.', why:'Fix: merge R1+R2 and R3+R4 first. Then the two results ARE in parallel.'},
 {t:'Combine rules — C is flipped', viz:'rules', body:'Once you know HOW two parts are connected, you still need the right rule. <b>Resistors and inductors</b>: series add, parallel = product ÷ sum. <b>Capacitors are backwards</b>: parallel add, series = product ÷ sum.', why:'Why: parallel caps = bigger plates (more C). Series caps = a thicker gap (less C). Only same-kind parts merge.'},
 {t:'DC steady state', viz:'dcss', body:'After a DC source has been on a long time, nothing is changing. An <b>inductor</b> only fights <i>change</i> → it\'s just a <b>wire</b>. A <b>capacitor</b> is full and its plates never touch → it\'s a <b>gap</b>.', why:'Watch out: a wire across a parallel group shorts the whole group; a gap kills its whole series branch.'},
 {t:'RC pulse & the time constant', viz:'tauV', body:'An <b>RC pulse circuit</b> is a capacitor being charged and discharged as a switch flips (or a square wave pulses). How fast? <b>τ = R × C</b>, where R is the resistance the capacitor <b>sees</b>: turn the battery into a wire, look in from C\'s two terminals, and reduce.', why:'This is the same move as finding R<sub>Th</sub> on your last test — the capacitor is the "load".'},
 {t:'Transformers in a circuit', viz:'xfR', body:'A transformer has no wire between its sides, so parts on opposite sides are never in series or parallel. Reduce the <b>secondary load</b> first. From the primary, that load looks like <b>a² × R</b> (a = N<sub>P</sub>/N<sub>S</sub>).', why:'Step-down (a > 1) makes the load look bigger; step-up (a < 1) makes it look smaller. (This goes one step past Worksheet 13.)'},
 {t:'Strategy', viz:'labStrat', body:'Start <b>far from the source</b> and find the <b>innermost</b> simple pair. Merge it — the circuit gets simpler and new pairs appear. Repeat until nothing can merge.', why:'Controls: ✚ move · bottom button picks · press a part twice for DC / transformer moves · R hint · L these rules.'},
];

  spawn({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(opt.up||0),life:l,max:l,size:rnd(.6,1.2)*(opt.size||7),color:choice(cols),kind:choice(kinds),rot:rnd(0,6),vr:rnd(-12,12),g:opt.g??500,drag:opt.drag??.9})}}
function ringFx(x,y,color,r,life=.5,w=6){spawn({x,y,kind:'ring',size:r,life,max:life,color,w})}
function floatText(x,y,text,color='#5c4078',size=26){spawn({x,y,vy:-70,kind:'text',text,color,size,life:1.1,max:1.1,g:0,drag:.97})}
function star(c,x,y,r,rot){c.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.42:r,a=rot+i*Math.PI/4;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath()}
function updateParticles(dt){ for(let i=P.length-1;i>=0;i--){const p=P[i]; p.life-=dt; if(p.life<=0){P.splice(i,1);continue}
 const d=Math.pow(p.drag,dt*60); p.vx*=d; p.vy=p.vy*d+p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt}}
function drawParticles(c){ for(const p of P){const k=p.life/p.max; c.save(); c.globalAlpha=Math.min(1,k*1.6);
 if(p.kind==='dot'){c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.size*(.4+.6*k),0,7);c.fill()}
 else if(p.kind==='star'){c.fillStyle=p.color;c.strokeStyle='#fff';c.lineWidth=1.5;star(c,p.x,p.y,p.size*1.3*(.5+.5*k),p.rot);c.fill();c.stroke()}
 else if(p.kind==='confetti'){c.translate(p.x,p.y);c.rotate(p.rot);c.scale(Math.cos(p.rot*1.7),1);c.fillStyle=p.color;c.fillRect(-p.size*.6,-p.size*.3,p.size*1.2,p.size*.6)}
 else if(p.kind==='ring'){const e=1-k;c.strokeStyle=p.color;c.lineWidth=p.w*k;c.beginPath();c.arc(p.x,p.y,p.size*(1-Math.pow(1-e,3)),0,7);c.stroke()}
 else if(p.kind==='text'){const e=1-k, s=e<.15?.4+e/.15*.8:e<.25?1.2-(e-.15)*2:1; c.translate(p.x,p.y);c.scale(s,s);c.font=`700 ${p.size}px Fredoka, Nunito, sans-serif`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=p.size*.28;c.strokeStyle='#fff';c.strokeText(p.text,0,0);c.fillStyle=p.color;c.fillText(p.text,0,0)}
 c.restore()}}

/* ===================================================================== projectiles */
const SHOTS=[];
function shoot(x0,y0,x1,y1,kind,onHit){SHOTS.push({x0,y0,x1,y1,kind,onHit,t:0,dur:kind==='star'?.42:.34,cx:(x0+x1)/2+rnd(-80,80),cy:Math.min(y0,y1)-rnd(40,120)})}
function updateShots(dt){for(let i=SHOTS.length-1;i>=0;i--){const s=SHOTS[i]; s.t+=dt/s.dur; const t=Math.min(1,s.t), e=t*t*(3-2*t)*.3+t*.7;
 const u=1-e; s.x=u*u*s.x0+2*u*e*s.cx+e*e*s.x1; s.y=u*u*s.y0+2*u*e*s.cy+e*e*s.y1;
 for(let k=0;k<2;k++) spawn({x:s.x+rnd(-5,5),y:s.y+rnd(-5,5),vx:rnd(-40,40),vy:rnd(-40,40),life:.35,max:.35,size:rnd(3,7),color:s.kind==='star'?choice(PASTELS):'#ff9fb0',kind:s.kind==='star'?'star':'dot',g:0});
 if(s.t>=1){SHOTS.splice(i,1); s.onHit&&s.onHit()}}}
function drawShots(c){for(const s of SHOTS){ if(s.x===undefined)continue; c.save();
 if(s.kind==='star'){const g=c.createRadialGradient(s.x,s.y,0,s.x,s.y,34);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,240,180,0)');c.fillStyle=g;c.beginPath();c.arc(s.x,s.y,34,0,7);c.fill();
  c.fillStyle='#fff1a8';c.strokeStyle='#fff';c.lineWidth=3;star(c,s.x,s.y,16,G.t*12);c.fill();c.stroke()}
 else{c.strokeStyle='#ff8fa6';c.lineWidth=5;c.lineCap='round';c.beginPath();let x=s.x,y=s.y;c.moveTo(x,y);for(let k=0;k<4;k++){x+=rnd(-14,14);y+=rnd(-14,14);c.lineTo(x,y)}c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(s.x,s.y,7,0,7);c.fill()}
 c.restore()}}

/* ===================================================================== boss renderer */
function newBoss(type){return {type,t:rnd(0,10),sx:1,sy:1,vsx:0,vsy:0,flash:0,mood:'idle',moodT:0,oy:0,voy:0,dead:false,deadT:0,gone:false,look:0}}
function squash(b,sx,sy){b.sx=sx;b.sy=sy;b.vsx=0;b.vsy=0}
function bossUpdate(b,dt){ b.t+=dt; const k=320,d=13;
 b.vsx+=((1-b.sx)*k-b.vsx*d)*dt; b.sx+=b.vsx*dt; b.vsy+=((1-b.sy)*k-b.vsy*d)*dt; b.sy+=b.vsy*dt;
 b.flash=Math.max(0,b.flash-dt*5); if(b.moodT>0){b.moodT-=dt; if(b.moodT<=0&&!b.dead) b.mood='idle'}
 if(b.oy<0||b.voy!==0){ b.voy+=2800*dt; b.oy+=b.voy*dt; if(b.oy>=0){ b.oy=0; if(b.voy>320){b.voy*=-.32; squash(b,1.38,.66); if(b.onLand)b.onLand(b.voy)} else b.voy=0 } }
 if(b.dead) b.deadT+=dt;
}
function bossColors(b){ if(b.type==='mega'){const h=(b.t*40)%360; return {c1:`hsl(${h},100%,86%)`,c2:`hsl(${h},55%,62%)`}} return BOSSES[b.type] }
function helix(c,x0,y0,x1,y1,turns,w,t){const n=60;c.beginPath();for(let i=0;i<=n;i++){const s=i/n,ph=s*turns*Math.PI*2+t;const px=lerp(x0,x1,s),py=lerp(y0,y1,s);const dx=y1-y0,dy=-(x1-x0),L=Math.hypot(dx,dy)||1;const o=Math.sin(ph)*w;const along=Math.cos(ph)*w*.35;
 const ux=(x1-x0)/(Math.hypot(x1-x0,y1-y0)||1),uy=(y1-y0)/(Math.hypot(x1-x0,y1-y0)||1);const X=px+dx/L*o+ux*along,Y=py+dy/L*o+uy*along;i?c.lineTo(X,Y):c.moveTo(X,Y)}c.stroke()}
function drawBoss(c,b,x,y,r){
 if(b.gone) return; const col=bossColors(b), t=b.t; let s=1;
 if(b.dead){ s=1+Math.min(.35,b.deadT*.5); x+=Math.sin(b.deadT*70)*r*.06*Math.min(1,b.deadT*2) }
 y+=b.oy+Math.sin(t*2.1)*r*.05;
 // shadow
 c.save(); c.fillStyle='rgba(92,64,120,.13)'; const sh=clamp(1+b.oy/400,.3,1); c.beginPath(); c.ellipse(x,y-b.oy+r*1.08,r*.8*sh*b.sx,r*.14*sh,0,0,7); c.fill(); c.restore();
 c.save(); c.translate(x,y+r); c.scale(b.sx*s,b.sy*s); c.translate(0,-r);
 c.lineCap='round'; c.lineJoin='round';
 const ty=b.type;
 // behind-body accessories
 if(ty==='xformer'){ c.fillStyle=col.c2; for(const dx of [-.22,.22]){ c.beginPath(); c.roundRect(dx*r-r*.07,-r*1.35,r*.14,r*2.55,r*.06); c.fill() } }
 if(ty==='coil'){ c.strokeStyle=col.c2; c.lineWidth=r*.085; helix(c,-r*.42,-r*.7,-r*.62,-r*1.6,3.5,r*.13,t*3); helix(c,r*.42,-r*.7,r*.62,-r*1.6,3.5,r*.13,t*3+1);
   c.fillStyle='#fff'; for(const sx of [-.62,.62]){c.beginPath();c.arc(sx*r,-r*1.62,r*.11,0,7);c.fill();c.strokeStyle=col.c2;c.lineWidth=r*.05;c.stroke()} }
 if(ty==='sine'){ c.strokeStyle=col.c2; c.lineWidth=r*.08; c.beginPath(); c.moveTo(0,-r*.9); c.lineTo(0,-r*1.3); c.stroke(); c.beginPath();
   for(let i=0;i<=40;i++){const s2=i/40, X=lerp(-r*.65,r*.65,s2), Y=-r*1.42+Math.sin(s2*Math.PI*4+t*5)*r*.13; i?c.lineTo(X,Y):c.moveTo(X,Y)} c.stroke() }
 if(ty==='tau'){ c.strokeStyle=col.c2; c.lineWidth=r*.1; c.beginPath(); for(let i=0;i<=30;i++){const s2=i/30, X=lerp(-r*.5,r*.75,s2), Y=-r*.8-(1-Math.exp(-s2*4))*r*.75*(1+Math.sin(t*3)*.05); i?c.lineTo(X,Y):c.moveTo(X,Y)} c.stroke();
   c.fillStyle='#fff'; c.beginPath(); c.arc(r*.75,-r*1.53,r*.09,0,7); c.fill() }
 if(ty==='cap'){ c.strokeStyle=col.c2; c.lineWidth=r*.08; c.beginPath(); c.moveTo(0,-r*.95); c.lineTo(0,-r*1.18); c.stroke() }
 if(ty==='lab'){ c.strokeStyle=col.c2; c.lineWidth=r*.08; c.beginPath(); c.moveTo(0,-r*.9); for(let i=0;i<6;i++) c.lineTo((i%2?1:-1)*r*.16,-r*1.0-i*r*.1); c.lineTo(0,-r*1.62); c.stroke(); c.fillStyle='#ffc56b'; c.beginPath(); c.arc(0,-r*1.68,r*.11,0,7); c.fill() }
 // body path
 const pts=[], N=56;
 for(let i=0;i<N;i++){const a=i/N*Math.PI*2; let rr=r*(1+.035*Math.sin(3*a+t*2.2)+.022*Math.sin(5*a-t*3.1));
  if(ty==='xformer'){const n=4,ca=Math.abs(Math.cos(a)),sa=Math.abs(Math.sin(a)); rr*=.93/Math.pow(Math.pow(ca,n)+Math.pow(sa,n),1/n)}
  if(ty==='sine'&&Math.sin(a)>0) rr*=1+.07*Math.sin(a)*Math.sin(a*7+t*6);
  if(ty==='cap'){rr*=1-.12*Math.pow(Math.abs(Math.sin(a)),3)}
  pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}
 const path=()=>{c.beginPath(); for(let i=0;i<N;i++){const p=pts[i],q=pts[(i+1)%N],mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2; i?c.quadraticCurveTo(p[0],p[1],mx,my):c.moveTo(mx,my)} c.closePath()};
 const gr=c.createRadialGradient(-r*.35,-r*.45,r*.1,0,0,r*1.15); gr.addColorStop(0,'#fff'); gr.addColorStop(.35,col.c1); gr.addColorStop(1,col.c1);
 path(); c.fillStyle=gr; c.fill(); c.lineWidth=r*.055; c.strokeStyle=col.c2; c.stroke();
 if(b.flash>0){path(); c.fillStyle=`rgba(255,255,255,${b.flash})`; c.fill()}
 // front accessories
 if(ty==='cap'){ for(const [yy,sg] of [[-1.25,'+'],[1.08,'−']]){ c.fillStyle=col.c2; c.beginPath(); c.roundRect(-r*.95,yy*r,r*1.9,r*.17,r*.08); c.fill(); c.fillStyle='#fff'; c.font=`700 ${r*.2}px Fredoka`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(sg,r*.75,yy*r+r*.09) } }
 if(ty==='xformer'){ c.strokeStyle=col.c2; c.lineWidth=r*.07; helix(c,-r*.88,r*.05,-r*1.32,r*.25,3,r*.12,t*4); helix(c,r*.88,r*.05,r*1.32,r*.25,3,r*.12,-t*4) }
 if(ty==='tau'){ c.fillStyle=col.c2; c.font=`700 ${r*.36}px Fredoka`; c.textAlign='center'; c.textBaseline='middle'; c.globalAlpha=.55; c.fillText('τ',0,r*.62); c.globalAlpha=1 }
 if(ty==='mega'){ c.fillStyle='#fff1a8'; c.strokeStyle='#e8bf5a'; c.lineWidth=r*.05; c.beginPath(); const cw=r*.7, cy=-r*.88;
   c.moveTo(-cw,cy); c.lineTo(-cw,cy-r*.35); c.lineTo(-cw*.5,cy-r*.15); c.lineTo(0,cy-r*.48); c.lineTo(cw*.5,cy-r*.15); c.lineTo(cw,cy-r*.35); c.lineTo(cw,cy); c.closePath(); c.fill(); c.stroke();
   PASTELS.slice(0,3).forEach((g,i)=>{c.fillStyle=['#ff9fc0','#8fd4ff','#9fe8c4'][i]; c.beginPath(); c.arc((i-1)*cw*.55,cy-r*.12,r*.07,0,7); c.fill()}) }
 // face
 const ink='#4d3566', mood=b.dead?'dead':b.mood, ey=-r*.1, ex=r*.33;
 c.fillStyle='rgba(255,140,170,.45)'; for(const sx of [-1,1]){c.beginPath();c.ellipse(sx*r*.58,r*.18,r*.15,r*.09,0,0,7);c.fill()}
 c.strokeStyle=ink; c.fillStyle=ink; c.lineWidth=r*.065;
 const blink=(t%3.7)<.12?.12:1;
 if(mood==='hurt'||mood==='dead'){ for(const sx of [-1,1]){ c.beginPath(); if(mood==='dead'){c.moveTo(sx*ex-r*.1,ey-r*.1);c.lineTo(sx*ex+r*.1,ey+r*.1);c.moveTo(sx*ex+r*.1,ey-r*.1);c.lineTo(sx*ex-r*.1,ey+r*.1)} else {c.moveTo(sx*ex-sx*r*.12,ey-r*.11);c.lineTo(sx*ex+sx*r*.06,ey);c.lineTo(sx*ex-sx*r*.12,ey+r*.11)} c.stroke() }
   c.beginPath(); if(mood==='dead'){c.ellipse(0,r*.32,r*.09,r*.12,0,0,7);c.fill()} else {for(let i=0;i<=12;i++){const X=lerp(-r*.2,r*.2,i/12),Y=r*.3+Math.sin(i/12*Math.PI*3)*r*.04; i?c.lineTo(X,Y):c.moveTo(X,Y)} c.stroke()} }
 else if(mood==='laugh'){ for(const sx of [-1,1]){c.beginPath();c.arc(sx*ex,ey+r*.04,r*.12,Math.PI*1.1,Math.PI*1.9);c.stroke()}
   c.beginPath(); const mo=r*(.16+.05*Math.abs(Math.sin(t*22))); c.moveTo(-r*.24,r*.2); c.quadraticCurveTo(0,r*.2+mo*2.2,r*.24,r*.2); c.closePath(); c.fill(); c.fillStyle='#ff9fb8'; c.beginPath(); c.ellipse(0,r*.2+mo*.85,r*.1,r*.05,0,0,7); c.fill() }
 else { for(const sx of [-1,1]){ c.fillStyle='#fff'; c.beginPath(); c.ellipse(sx*ex,ey,r*.17,r*.21*blink,0,0,7); c.fill(); c.lineWidth=r*.035; c.stroke();
     if(blink>.5){ c.fillStyle=ink; c.beginPath(); c.arc(sx*ex+b.look*r*.05,ey+r*.03,r*.1,0,7); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(sx*ex+b.look*r*.05+r*.035,ey-r*.02,r*.035,0,7); c.fill() } }
   c.lineWidth=r*.06; c.beginPath(); c.arc(0,r*.18,r*.15,Math.PI*.15,Math.PI*.85); c.stroke() }
 c.restore();
}

/* ---------- map ---------- */
let MAPN=[];
function computeMap(){ const n=ALL_LEVELS.length, portrait=H>W*1.05; const top=64, bot=H-(portrait?150:118);
 const nr=clamp(Math.min(W,H)*.075,24,58);
 MAPN=ALL_LEVELS.map((L,i)=>{ if(portrait){ const y=lerp(top+nr*1.4,bot-nr*.8,i/(n-1)); return {x:W*(i%2?.7:.3),y,r:nr} }
   const x=lerp(W*.1,W*.9,i/(n-1)); const y=(top+bot)/2+Math.sin(i*1.25+.6)*(bot-top)*.2; return {x,y,r:nr} });
 if(!MAPN.boss) MAPN.boss=ALL_LEVELS.map(L=>newBoss(L.type)); else {} }
const mapBosses=ALL_LEVELS.map(L=>newBoss(L.type));
function bestOf(id){return best[id]||null}
function renderMapInfo(){ const L=ALL_LEVELS[G.mapIdx], b=bestOf(L.id); const n=L.id==='mega'?12:L.qs.length, isLab=L.id==='lab', solved=Object.keys(labSave.stars).length, st=Object.values(labSave.stars).reduce((a,b)=>a+b,0);
 $('#mapInfo').innerHTML=`<div><div class="mi-name">${L.boss}</div><div class="mi-sub">${isLab?`Series/parallel · combine rules · DC · τ · transformers · ${solved}/${LAB_PUZ.length} solved · ★ ${st}`:`${L.ws} · ${L.name} · ${n} questions`}${b?` · best <span class="grade g${b.g}" style="width:1.6em;height:1.6em">${b.g}</span>`:''}</div></div><div class="mi-btns">${LESSONS[L.id]?`<div class="go learn">📖 Learn ${Input.mode==='pad'?glyph(0):Input.mode==='key'?'(L)':''}</div>`:''}<div class="go fight">${isLab?'Play!':'Fight!'} ${Input.mode==='pad'?glyph(3):Input.mode==='key'?'(Enter)':''}</div></div>`;
 const tot=Object.values(best).reduce((s,v)=>s+(v.score||0),0); $('#mapScore').textContent=`✦ ${tot.toLocaleString()} best pts`;
 const bb=mapBosses[G.mapIdx]; squash(bb,1.25,.8); }
function mapInput(a,rep){ const n=ALL_LEVELS.length; let d=0;
 if(a==='right'||a==='down') d=1; else if(a==='left'||a==='up') d=-1;
 if(d){ G.mapIdx=(G.mapIdx+d+n)%n; store.set('cc_mapIdx',G.mapIdx); sfx.move(); rumble(.1,.2,40); renderMapInfo(); const m=MAPN[G.mapIdx]; burst(m.x,m.y,8,{speed:160,g:0,life:.5}); return }
 if(rep) return;
 if(a==='face3'||a==='learn') learnOrFight(ALL_LEVELS[G.mapIdx],true); else if(a==='face0'||a==='confirm'||a==='rt'||a==='face2') learnOrFight(ALL_LEVELS[G.mapIdx],false);
 else if(a==='face1'||a==='back') goTitle(); }
function drawMap(c){ const m=MAPN; if(!m.length) return;
 // path through nodes (catmull-rom)
 c.save(); c.lineCap='round'; c.lineJoin='round';
 const pathFn=()=>{c.beginPath(); c.moveTo(m[0].x,m[0].y); for(let i=0;i<m.length-1;i++){const p0=m[Math.max(0,i-1)],p1=m[i],p2=m[i+1],p3=m[Math.min(m.length-1,i+2)];
   c.bezierCurveTo(p1.x+(p2.x-p0.x)/6,p1.y+(p2.y-p0.y)/6,p2.x-(p3.x-p1.x)/6,p2.y-(p3.y-p1.y)/6,p2.x,p2.y)}};
 pathFn(); c.strokeStyle='rgba(255,255,255,.85)'; c.lineWidth=16; c.stroke();
 pathFn(); c.strokeStyle='#e6d6ff'; c.lineWidth=6; c.setLineDash([2,16]); c.lineDashOffset=-G.t*40; c.stroke(); c.setLineDash([]);
 m.forEach((n,i)=>{ const L=ALL_LEVELS[i], sel=i===G.mapIdx, b=mapBosses[i]; bossUpdate(b,0);
   const pulse=sel?1+Math.sin(G.t*6)*.05:1, R=n.r*pulse*(sel?1.15:1);
   if(sel){ c.save(); c.globalAlpha=.55+.25*Math.sin(G.t*5); c.strokeStyle='#fff'; c.lineWidth=6; c.setLineDash([10,9]); c.lineDashOffset=G.t*30; c.beginPath(); c.arc(n.x,n.y,R*1.32,0,7); c.stroke(); c.restore() }
   c.fillStyle='rgba(255,255,255,.9)'; c.beginPath(); c.arc(n.x,n.y,R*1.12,0,7); c.fill();
   drawBoss(c,b,n.x,n.y-R*.05+(sel?Math.sin(G.t*7)*R*.06:0),R*.62);
   c.font=`700 ${clamp(R*.34,11,17)}px Fredoka`; c.textAlign='center'; c.textBaseline='top'; c.lineWidth=5; c.strokeStyle='#fff'; c.fillStyle='#5c4078';
   const lbl=L.name; c.strokeText(lbl,n.x,n.y+R*1.22); c.fillText(lbl,n.x,n.y+R*1.22);
   const bs=bestOf(L.id); if(bs){ const gx=n.x+R*.85, gy=n.y-R*.85; c.fillStyle='#fff'; c.beginPath(); c.arc(gx,gy,R*.32,0,7); c.fill(); c.lineWidth=3; c.strokeStyle={S:'#e58bd0',A:'#6fb7e8',B:'#5fc59b',C:'#e8b25f',D:'#e8807f'}[bs.g]; c.stroke(); c.fillStyle=c.strokeStyle; c.textBaseline='middle'; c.font=`700 ${R*.36}px Fredoka`; c.fillText(bs.g,gx,gy+1) }
 });
 c.restore(); }
$('#map').addEventListener('pointerdown',e=>{ Input.mode='touch'; Snd.init(); const r=shakeEl.getBoundingClientRect(); const x=e.clientX-r.left,y=e.clientY-r.top;
 let hit=-1; MAPN.forEach((n,i)=>{ if(Math.hypot(n.x-x,n.y-y)<n.r*1.5) hit=i });
 tryFS(); if(e.target.closest('.learn')) return learnOrFight(ALL_LEVELS[G.mapIdx],true);

  if(mag>.6) d=Math.abs(ax)>Math.abs(ay)?(ax>0?'right':'left'):(ay>0?'down':'up'); else if(pd&&mag>.35) d=pd;
  if(d&&d!==pd){ this.useMode('pad'); this.lastPad=k; padSeen(p); emit(d,false); this.rep[k+'a']=.4 }
  else if(d&&d===pd){ this.rep[k+'a']-=dt; if(this.rep[k+'a']<=0){this.rep[k+'a']=.11; emit(d,true)} }
  this.axis[k]=d; } };
Input.useMode=function(m){ if(this.mode!==m){ this.mode=m; updateLegend(); if(G.screen==='lab') labCtl(); if(G.screen==='map') renderMapInfo(); if(LS.open) renderLesson() } };
function padSeen(p){ if(Input.seen) return; Input.seen=true; const ps=$('#padStatus'); ps.textContent='🎮 Controller ready!'; ps.classList.add('ok'); toast('🎮 '+(p.id.split('(')[0].trim().slice(0,38)||'Controller')+' connected') }
addEventListener('gamepadconnected',e=>{ toast('🎮 Controller detected — press any button'); });
addEventListener('gamepaddisconnected',()=>{ toast('Controller disconnected'); Input.seen=false });
let toastT=0; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2200) }
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Enter:'confirm',Space:'confirm',Escape:'start',KeyP:'start',KeyQ:'lb',KeyE:'rb',Backspace:'back',KeyL:'learn',KeyN:'skip',Digit1:'face3',Digit2:'face2',Digit3:'face1',Digit4:'face0'};
addEventListener('keydown',e=>{ const a=KEYMAP[e.code]; if(!a) return; e.preventDefault(); Input.useMode('key'); emit(a,e.repeat) });

function emit(a,rep){ Snd.init();
 if($('#zoom').classList.contains('on')){ if(!rep) closeZoom(); return }
 if(LS.open) return lessonInput(a,rep);
 if(G.screen==='title'){ if(!rep){ sfx.open(); goMap() } return }
 if(G.screen==='map') return mapInput(a,rep);
 if(G.screen==='battle') return battleInput(a,rep);
 if(G.screen==='lab') return labInput(a,rep); }
function battleInput(a,rep){
 if(G.paused) return pauseInput(a,rep);
 if(G.phase==='victory'){ if(rep) return; if(a==='face0'||a==='confirm'||a==='rt') goMap(); else if(a==='face2') startLevel(G.level); return }
 if(a==='start'&&!rep) return openPause();
 if((a==='select'||a==='skip')&&!rep){ if(G.phase==='question') return skipQuestion(); if(a==='select') return openPause(); return }
 if(G.phase==='question'){ if(rep) return;
   const slot={up:0,left:1,right:2,down:3,face3:0,face2:1,face1:2,face0:3}[a];
   if(slot!==undefined) return pickSlot(slot);
   if(a==='confirm'||a==='rt'||a==='lt'){ if(G.sel>=0) lockIn(G.sel); return }
   if(a==='lb') return openZoom(); if(a==='rb') return useHint(); }
 else if(G.phase==='feedback'){
   if(a==='up'||a==='down'){ $('#fb').scrollBy({top:a==='up'?-70:70,behavior:'smooth'}); return }
   if(rep) return; if(a==='lb') return openZoom();
   if(['face0','face1','face2','face3','confirm','rt'].includes(a)) continueAfterFeedback(); } }

/* ===================================================================== background */
const SH=[]; for(let i=0;i<30;i++) SH.push({x:Math.random(),y:Math.random(),s:rnd(6,20),k:choice(['circle','plus','wave','bolt','ring','circle']),sp:rnd(.008,.03),rot:rnd(0,6),vr:rnd(-.6,.6),c:choice(PASTELS),z:rnd(.4,1)});
function drawBg(c,dt){ for(let i=0;i<6;i++) G.theme[i]=lerp(G.theme[i],G.themeT[i],Math.min(1,dt*3));
 const t=G.theme, g=c.createLinearGradient(0,0,W*.3,H); g.addColorStop(0,rgb(t)); g.addColorStop(1,rgb(t.slice(3))); c.fillStyle=g; c.fillRect(0,0,W,H);
 if(G.fever){ c.save(); c.globalAlpha=.16; const g2=c.createLinearGradient(0,0,W,0); for(let i=0;i<=6;i++) g2.addColorStop(i/6,`hsl(${(G.t*90+i*60)%360},100%,80%)`); c.fillStyle=g2; c.fillRect(0,0,W,H); c.restore() }
 // soft grid
 c.save(); c.strokeStyle='rgba(255,255,255,.45)'; c.lineWidth=1; const gs=44, off=(G.t*10)%gs; c.beginPath(); for(let x=-off;x<W;x+=gs){c.moveTo(x,0);c.lineTo(x,H)} for(let y=-off;y<H;y+=gs){c.moveTo(0,y);c.lineTo(W,y)} c.stroke(); c.restore();
 for(const s of SH){ s.y-=s.sp*dt*(G.fever?3:1)*s.z; s.rot+=s.vr*dt; if(s.y<-.05){s.y=1.05;s.x=Math.random()}
  const x=s.x*W+Math.sin(G.t*.5+s.rot)*10, y=s.y*H, r=s.s*s.z; c.save(); c.translate(x,y); c.rotate(s.rot); c.globalAlpha=.55*s.z; c.strokeStyle=s.c; c.fillStyle=s.c; c.lineWidth=r*.28; c.lineCap='round'; c.lineJoin='round';
  if(s.k==='circle'){c.beginPath();c.arc(0,0,r*.6,0,7);c.fill()} else if(s.k==='ring'){c.beginPath();c.arc(0,0,r*.6,0,7);c.stroke()}
  else if(s.k==='plus'){c.beginPath();c.moveTo(-r*.6,0);c.lineTo(r*.6,0);c.moveTo(0,-r*.6);c.lineTo(0,r*.6);c.stroke()}
  else if(s.k==='wave'){c.beginPath();for(let i=0;i<=16;i++){const X=lerp(-r,r,i/16),Y=Math.sin(i/16*Math.PI*2)*r*.4;i?c.lineTo(X,Y):c.moveTo(X,Y)}c.stroke()}
  else {c.beginPath();c.moveTo(r*.15,-r*.8);c.lineTo(-r*.35,r*.1);c.lineTo(r*.1,r*.1);c.lineTo(-r*.15,r*.8);c.stroke()}
  c.restore() } }
const titleBosses=['sine','coil','xformer','cap','tau','mega'].map(newBoss);
function drawTitle(c,dt){ const n=titleBosses.length, r=clamp(Math.min(W,H)*.06,18,48); titleBosses.forEach((b,i)=>{ bossUpdate(b,dt); const x=W*(i+.5)/n, y=H-r*1.9+Math.abs(Math.sin(G.t*3+i*.7))*-r*.6; drawBoss(c,b,x,y,r) }) }

/* ===================================================================== main loop */
let last=performance.now();
function frame(now){ let dt=Math.min(.05,(now-last)/1000); last=now; Input.poll(dt); G.t+=dt;
 let gdt=dt; if(G.hitstop>0){G.hitstop-=dt; gdt=dt*.05}
 G.trauma=Math.max(0,G.trauma-dt*1.7); const sh=G.trauma*G.trauma*18; shakeEl.style.transform=sh>.2?`translate(${(Math.random()*2-1)*sh}px,${(Math.random()*2-1)*sh}px)`:'';
 drawBg(bctx,dt);
 if(G.screen==='title') drawTitle(bctx,dt);
 else if(G.screen==='map'){ mapBosses.forEach(b=>bossUpdate(b,dt)); drawMap(bctx) }
 else if(G.screen==='lab') drawLab(bctx,dt);
 else if(G.screen==='battle'){ bossUpdate(BOSS,gdt); const p=bossPos(); drawBoss(bctx,BOSS,p.x,p.y,p.r); placeBubble();
   if(G.phase==='question'){ const el=(performance.now()-G.qStart)/1000, f=Math.max(0,1-el/45); $('#ringBar').style.strokeDashoffset=(94.25*(1-f)).toFixed(1); $('#ringTxt').textContent='+'+Math.round(100*f*(G.hintUsed?.5:1)) }
   G.dispScore=(G.dispScore??0); G.dispScore+= (G.score-G.dispScore)*Math.min(1,dt*8); if(Math.abs(G.score-G.dispScore)<1) G.dispScore=G.score; $('#score').textContent=Math.round(G.dispScore).toLocaleString();
   if(G.fever&&Math.random()<dt*14) spawn({x:rnd(0,W),y:H+10,vx:rnd(-20,20),vy:rnd(-160,-90),life:2,max:2,size:rnd(4,8),color:choice(PASTELS),kind:'star',g:0,drag:.995,vr:rnd(-4,4)}); }
 if(LS.open) drawLessonViz(dt);
 updateShots(gdt); updateParticles(gdt);
 fctx.clearRect(0,0,W,H);
 if(G.flashBad>0){ G.flashBad-=dt*1.6; const g=fctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75); g.addColorStop(0,'rgba(255,159,176,0)'); g.addColorStop(1,`rgba(255,140,165,${Math.max(0,G.flashBad)*.7})`); fctx.fillStyle=g; fctx.fillRect(0,0,W,H) }
 if(G.flashGood>0){ G.flashGood-=dt*2; fctx.fillStyle=`rgba(255,255,255,${Math.max(0,G.flashGood)*.25})`; fctx.fillRect(0,0,W,H) }
 drawShots(fctx); drawParticles(fctx);
 requestAnimationFrame(frame) }

resize(); goTitle(); updateLegend();
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{});
requestAnimationFrame(frame);
</script>
</body>
